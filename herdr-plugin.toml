id = "herdr.command-list"
name = "Command List"
version = "1.0.1"
min_herdr_version = "0.9.0"
description = "Small, auditable command list with sections, search, and quick execution."
platforms = ["linux", "macos"]

[[build]]
platforms = ["linux", "macos"]
command = ["env", "GOTOOLCHAIN=local", "go", "build", "-trimpath", "-o", "command-list", "."]

[[panes]]
id = "command-list"
title = "Command List"
description = "Browse and run commands from commands.md"
platforms = ["linux", "macos"]
placement = "popup"
width = "78%"
height = "62%"
command = ["./command-list", "ui"]

[[actions]]
id = "toggle"
title = "Command List"
description = "Open Command List"
platforms = ["linux", "macos"]
contexts = ["global", "workspace", "tab", "pane"]
command = ["./command-list", "open"]
